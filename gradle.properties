# BCDebugJavaAgent build properties
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512M -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Agent version
agent_version=v26.1-Alpha.10
agent_semver=26.1.0-Alpha.10
maven_group=dev.blockconnect.bcagent

# ASM version
asm_version=9.7.1

# Java targets (26.x = JDK 21, 1.20.x = JDK 17, 1.12.2 = JDK 8)
java_version_26=21
java_version_20=17
java_version_legacy=8
