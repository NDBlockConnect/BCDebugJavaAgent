// BCDebugJavaAgent — root build script
// Multi-project: core (bytecode analysis), agent (premain/agentmain), hooks-26 (MC 26.x specific)

subprojects {
    apply plugin: 'java'

    group = maven_group
    version = agent_version

    repositories {
        mavenCentral()
        maven { url = 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
    }

    dependencies {
        implementation "org.ow2.asm:asm:${asm_version}"
        implementation "org.ow2.asm:asm-tree:${asm_version}"
        implementation "org.ow2.asm:asm-commons:${asm_version}"

        testImplementation platform('org.junit:junit-bom:5.11.4')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    test {
        useJUnitPlatform()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    compileJava {
        options.encoding = 'UTF-8'
        // Bytecode target 17: agent must load on JDK 17 game JVMs (MC 1.20.x)
        // while remaining fully compatible with JDK 21 (MC 26.x / 1.21.x).
        options.release = 17
    }

    jar {
        manifest {
            attributes(
                'Implementation-Title': project.name,
                'Implementation-Version': agent_version,
                'Implementation-Vendor': 'BlockConnect'
            )
        }
    }
}

def runtimeDeps = project(':bc-agent').configurations.runtimeClasspath
    .filter { it.isFile() && it.name.endsWith('.jar') && !it.path.contains('bc-agent') }

// Merges META-INF/services entries across all input jars into targetDir.
// A plain EXCLUDE strategy would keep only the first module's service file and
// silently drop hook providers registered by other modules.
def collectServices = { jars, String targetDir ->
    delete(targetDir)
    file(targetDir).mkdirs()
    def servicesByName = new LinkedHashMap<String, LinkedHashSet<String>>()
    jars.findAll { it.isFile() }.each { jar ->
        def zf = new java.util.zip.ZipFile(jar)
        try {
            zf.entries().each { e ->
                if (!e.isDirectory() && e.name.startsWith('META-INF/services/')) {
                    def lines = (zf.getInputStream(e).getText('UTF-8') ?: '')
                        .readLines()*.trim().findAll { it && !it.startsWith('#') }
                    servicesByName.computeIfAbsent(e.name, { new LinkedHashSet<String>() })
                        .addAll(lines)
                }
            }
        } finally {
            zf.close()
        }
    }
    servicesByName.each { entry, impls ->
        new File(targetDir, entry.substring('META-INF/services/'.length())).text = impls.join('\n') + '\n'
    }
}

/**
 * Inner jar with every agent class except the BCAgent shim: core, hooks,
 * control plane plus shaded ASM/Gson and merged SPI services. At runtime the
 * shim appends this jar to the bootstrap class loader search so agent classes
 * resolve from one consistent loader regardless of game-side classloading.
 */
tasks.register('bootstrapJar', Jar) {
    dependsOn subprojects.jar

    destinationDirectory = layout.buildDirectory.dir('libs')
    archiveFileName = "bcdebug-javaagent-bootstrap-${agent_version}.jar"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    doFirst {
        collectServices(
            subprojects.collectMany { it.tasks.jar.outputs.files.files } + runtimeDeps.files,
            "${buildDir}/tmp/bootstrap-merged-services")
    }

    from(subprojects.collect {
        it.tasks.jar.outputs.files.collect { f -> zipTree(f) }
    }) {
        exclude 'META-INF/services/**'
        exclude 'dev/blockconnect/bcagent/BCAgent.class'
        exclude 'dev/blockconnect/bcagent/BCAgent$*.class'
    }

    from(runtimeDeps.collect { zipTree(it) }) {
        exclude 'META-INF/services/**'
    }

    from("${buildDir}/tmp/bootstrap-merged-services") {
        into 'META-INF/services'
    }
}

tasks.register('fatJar', Jar) {
    dependsOn tasks.bootstrapJar

    archiveBaseName = 'bcdebug-javaagent'
    archiveVersion = agent_version
    archiveClassifier = ''
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    destinationDirectory = layout.buildDirectory.dir('libs')

    // Outer jar carries ONLY the reflective shim.
    from(project(':bc-agent').sourceSets.main.output) {
        include 'dev/blockconnect/bcagent/BCAgent.class'
        include 'dev/blockconnect/bcagent/BCAgent$*.class'
    }

    // Embedded bootstrap jar, extracted to a temp file by the shim at runtime.
    // Fixed resource name — the shim looks it up by constant.
    into('META-INF/bootstrap') {
        from tasks.bootstrapJar.archiveFile
        rename { 'bcdebug-bootstrap.jar' }
    }

    manifest {
        attributes(
            'Premain-Class': 'dev.blockconnect.bcagent.BCAgent',
            'Agent-Class': 'dev.blockconnect.bcagent.BCAgent',
            'Can-Redefine-Classes': 'true',
            'Can-Retransform-Classes': 'true',
            'Can-Set-Native-Method-Prefix': 'true',
            'Implementation-Title': 'BCDebugJavaAgent',
            'Implementation-Version': agent_version,
            'Implementation-Vendor': 'BlockConnect'
        )
    }
}
